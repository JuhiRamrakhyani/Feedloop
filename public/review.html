<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FeedLoop — Review</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/css/theme.css">
<script>
  (function () {
    try {
      var root = document.documentElement;
      var t = localStorage.getItem('feedloop-theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      var a = localStorage.getItem('feedloop-accent') || 'indigo';
      root.setAttribute('data-theme', t);
      root.setAttribute('data-accent', a);
    } catch (e) {}
  })();
</script>
</head>
<body>
<header class="navbar">
  <div class="nav-inner">
    <div class="brand">
      <span class="brand-mark"><span class="brand-dot"></span>FeedLoop</span>
    </div>
    <nav class="tabs">
      <button type="button" onclick="location.href='/index.html'">Admin</button>
      <button type="button" class="active" onclick="location.href='/review.html'">Review</button>
    </nav>
    <div class="nav-actions">
      <div id="themeControl"></div>
    </div>
  </div>
</header>

<main class="container">
  <header class="page-head">
    <h1 class="pagehead">Review dashboard</h1>
    <p class="pagesub">Submitted feedback at a glance.</p>
  </header>

  <div class="summary-cards" id="summaryCards"></div>

  <div class="card">
    <h3>Responses</h3>
    <p class="desc">Select a row to see the full answer set.</p>
    <div id="reviewList"></div>
  </div>
</main>

<script src="/js/theme.js"></script>
<script src="/js/review.js"></script>
</body>
</html>
